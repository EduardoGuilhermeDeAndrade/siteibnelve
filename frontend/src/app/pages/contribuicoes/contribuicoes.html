<section class="section contribuicoes">
  <app-section-heading
    [level]="1"
    eyebrow="Contribuições"
    title="Contribua com a obra da IBNELVE"
    subtitle="Sua contribuição sustenta o trabalho da igreja em nossa comunidade, nos bairros Vereda e Liberdade."
  ></app-section-heading>

  <article class="card contribuicoes__pix">
    <p class="eyebrow">Chave PIX · CNPJ</p>
    <p class="contribuicoes__chave">{{ chavePix }}</p>
    <p class="contribuicoes__favorecido">
      Favorecido: Igreja Batista Nacional da Esperança do Liberdade e Vereda
    </p>

    <button class="button button--primary" type="button" (click)="copiarChave()">
      Copiar chave PIX
    </button>

    <p class="sr-only" role="status" aria-live="polite">
      @if (copiado()) {
        Chave PIX copiada para a área de transferência.
      }
    </p>
    @if (copiado()) {
      <p class="contribuicoes__confirmacao" aria-hidden="true">Chave copiada!</p>
    }

    <p class="contribuicoes__qr">QR Code PIX em breve.</p>
  </article>
</section>

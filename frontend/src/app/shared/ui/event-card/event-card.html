<article class="card event-card">
  <p class="event-card__categoria">{{ evento.categoriaLabel }}</p>
  <h3 class="event-card__titulo">{{ evento.titulo }}</h3>
  <p class="event-card__data">
    {{ evento.data | date: "EEEE, d 'de' MMMM 'às' HH:mm" }}
  </p>
  <p class="event-card__local">
    {{ evento.local }}
    @if (evento.localObservacao) {
      <span class="event-card__observacao">({{ evento.localObservacao }})</span>
    }
  </p>
</article>

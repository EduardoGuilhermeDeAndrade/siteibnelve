<div class="admin-shell">
  <a class="skip-link" href="#admin-main-content">Pular para o conteúdo</a>

  <header class="admin-shell__topbar">
    <span class="admin-shell__brand">IBNELVE · Admin</span>
    <div class="admin-shell__usuario">
      <span>{{ authService.usuario()?.nomeCompleto }}</span>
      <button class="button button--outline" type="button" (click)="sair()">Sair</button>
    </div>
  </header>

  <div class="admin-shell__corpo">
    <nav class="admin-shell__nav" aria-label="Menu do Portal Admin">
      <a routerLink="/admin" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Início
      </a>
      <a routerLink="/admin/agenda" routerLinkActive="is-active">Agenda</a>
      <a routerLink="/admin/locais" routerLinkActive="is-active">Locais</a>
      <a routerLink="/admin/conteudo" routerLinkActive="is-active">Conteúdo do Site</a>
      <a routerLink="/admin/ministerios" routerLinkActive="is-active">Ministérios</a>
      <a routerLink="/admin/contribuicoes" routerLinkActive="is-active">Contribuições</a>
      <a routerLink="/admin/usuarios" routerLinkActive="is-active">Usuários</a>
      <a routerLink="/admin/configuracoes" routerLinkActive="is-active">Configurações</a>
    </nav>

    <main id="admin-main-content" class="admin-shell__conteudo" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

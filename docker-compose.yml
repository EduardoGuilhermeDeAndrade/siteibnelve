services:
  postgres:
    image: postgres:16-alpine
    container_name: ibnelve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibnelve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-ibnelve}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ibnelve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibnelve}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ibnelve_pgdata:
